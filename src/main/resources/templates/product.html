<div th:fragment="content">
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
    <a class="navbar-brand" href="/">Mini-Amazon</a>
    <div class="ms-auto">
      <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
    </div>
  </nav>

  <!-- Product Details -->
  <div class="container mt-4">
    <div class="row">
      <div class="col-md-5 text-center">
        <img id="productImage" src="https://dummyimage.com/400x400/eeeeee/333333&text=Loading..." class="img-fluid rounded" alt="Product Image">
      </div>
      <div class="col-md-7">
        <h2 id="productName" class="mb-3">Loading...</h2>
        <h4 id="productPrice" class="text-success mb-3"></h4>
        <div id="productDescription" class="mb-3"></div>
        <div id="productCategory" class="mb-4 text-muted"></div>
        <button class="btn btn-primary btn-lg" onclick="addToCart()">Add to Cart</button>
      </div>
    </div>
  </div>
</div>
