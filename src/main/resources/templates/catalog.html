<div th:fragment="content">
  <div class="container mt-4">
    <!-- Search + Filter Form -->
    <form class="d-flex mb-4" onsubmit="event.preventDefault(); loadProducts();">
      <select id="categoryFilter" class="form-select me-2" style="max-width: 160px;" onchange="loadProducts()">
        <option value="">All Categories</option>
        <!-- Categories dynamically filled -->
      </select>
      <input id="searchInput" class="form-control me-2" type="search" placeholder="Search products..." oninput="searchProducts()" />
      <button class="btn btn-primary" type="button" onclick="loadProducts()">Search</button>
    </form>

    <!-- Product List -->
    <div id="productList" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3">
      <!-- Products dynamically filled -->
    </div>
  </div>
</div>
