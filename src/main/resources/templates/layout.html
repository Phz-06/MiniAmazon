<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title th:text="${title}">Mini Amazon</title>

  <!-- Bootstrap Styles -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Page Style -->
  <link rel="stylesheet" th:if="${css}" th:href="@{'/css/' + ${css}}">
</head>

<body>
  <!-- Page Content -->
  <div th:if="${#strings.isEmpty(template) == false and #strings.isEmpty(fragment) == false}"
       th:replace="~{${template} :: ${fragment}}">
  </div>

  <!-- Page Script -->
  <script th:src="@{/js/utils.js}"></script>
  <script th:if="${js}" th:src="@{'/js/' + ${js}}"></script>

  <!-- Bootstrap Script -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
</body>

</html>
