<div th:fragment="content">
  <!-- Navbar -->
  <div th:replace="~{components/navbar :: navbar}"></div>

  <div class="container mt-4">
    <h2>Your Orders</h2>

    <form class="d-flex gap-2 mb-4" onsubmit="event.preventDefault(); loadOrder();">
      <input id="orderIdInput" type="text" class="form-control" placeholder="Enter your Order ID" />
      <button class="btn btn-primary" type="submit">Load Order</button>
    </form>

    <div id="orderDetails" class="card p-3 shadow-sm d-none">
      <h5>Order Details</h5>
      <p><strong>Order ID:</strong> <span id="orderId"></span></p>
      <p><strong>Status:</strong> <span id="orderStatus"></span></p>
      <p><strong>Delivery Location:</strong> (<span id="deliveryX"></span>, <span id="deliveryY"></span>)</p>
      <h6>Items:</h6>
      <ul id="orderItems" class="list-group"></ul>
    </div>

    <div id="orderError" class="alert alert-danger d-none mt-4"></div>
  </div>
</div>
