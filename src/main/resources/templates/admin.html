<div th:fragment="content">
  <!-- Admin Dashboard Content -->
  <div class="container mt-4">
    <h2 class="mb-4">World Simulator Control Panel</h2>

    <!-- Connect to World -->
    <div class="card mb-4">
      <div class="card-body">
        <h5 class="card-title">Connect to World</h5>
        <div class="row g-2">
          <div class="col-md-4">
            <input type="text" id="connectHost" class="form-control" placeholder="Host (default localhost)">
          </div>
          <div class="col-md-2">
            <input type="number" id="connectPort" class="form-control" placeholder="Port (default 23456)">
          </div>
          <div class="col-md-4">
            <input type="text" id="connectWorldId" class="form-control" placeholder="World ID (optional)">
          </div>
          <div class="col-md-2">
            <button class="btn btn-success w-100" onclick="connectWorld()">Connect</button>
          </div>
        </div>
        <div id="connectStatus" class="mt-2 text-muted small"></div>
      </div>
    </div>

    <!-- Disconnect -->
    <div class="card mb-4">
      <div class="card-body">
        <h5 class="card-title">Disconnect from World</h5>
        <button class="btn btn-danger" onclick="disconnectWorld()">Disconnect</button>
        <div id="disconnectStatus" class="mt-2 text-muted small"></div>
      </div>
    </div>

    <!-- Set Speed -->
    <div class="card mb-4">
      <div class="card-body">
        <h5 class="card-title">Set Simulation Speed</h5>
        <div class="input-group">
          <input type="number" id="speedInput" class="form-control" placeholder="Speed">
          <button class="btn btn-primary" onclick="setSpeed()">Set Speed</button>
        </div>
        <div id="speedStatus" class="mt-2 text-muted small"></div>
      </div>
    </div>

    <!-- Buy Product -->
    <div class="card mb-4">
      <div class="card-body">
        <h5 class="card-title">Buy Product</h5>
        <div class="row g-2">
          <div class="col-md-3">
            <input type="number" id="buyWarehouseId" class="form-control" placeholder="Warehouse ID">
          </div>
          <div class="col-md-3">
            <input type="number" id="buyProductId" class="form-control" placeholder="Product ID">
          </div>
          <div class="col-md-4">
            <input type="text" id="buyDescription" class="form-control" placeholder="Description">
          </div>
          <div class="col-md-2">
            <input type="number" id="buyCount" class="form-control" placeholder="Count">
          </div>
        </div>
        <button class="btn btn-primary mt-2" onclick="buyProduct()">Buy</button>
        <div id="buyStatus" class="mt-2 text-muted small"></div>
      </div>
    </div>

    <!-- Get World ID -->
    <div class="card mb-4">
      <div class="card-body">
        <h5 class="card-title">Get World ID</h5>
        <button class="btn btn-info" onclick="getWorldId()">Get</button>
        <div id="worldIdStatus" class="mt-2 text-muted small"></div>
      </div>
    </div>
  </div>

  <!-- UPS Control Panel -->
  <div class="container mt-4 mb-4">
    <div class="card-body">
      <h5 class="card-title">UPS Server Control</h5>

      <div class="row g-2 mb-3">
        <div class="col-md-4">
          <input type="text" id="upsHost" class="form-control" placeholder="Host (default localhost)">
        </div>
        <div class="col-md-4">
          <input type="number" id="upsPort" class="form-control" placeholder="Port (optional)">
        </div>
        <div class="col-md-4 d-grid">
          <button class="btn btn-success" onclick="connectUPS()">Connect to UPS</button>
        </div>
      </div>

      <div class="d-grid gap-2 mb-3">
        <button class="btn btn-secondary" onclick="connectUPSDefault()">Connect with Default Settings</button>
        <button class="btn btn-danger" onclick="disconnectUPS()">Disconnect from UPS</button>
      </div>

      <div class="row g-2 mb-3">
        <div class="col-md-6 d-grid">
          <button class="btn btn-primary" onclick="startUPSServer()">Start UPS Server</button>
        </div>
        <div class="col-md-6 d-grid">
          <button class="btn btn-warning" onclick="stopUPSServer()">Stop UPS Server</button>
        </div>
      </div>

      <div class="d-grid">
        <button class="btn btn-info" onclick="checkUPSStatus()">Check UPS Connection Status</button>
      </div>

      <div id="upsStatus" class="mt-2 text-muted small"></div>
    </div>
  </div>
</div>
