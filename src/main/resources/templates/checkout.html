<div th:fragment="content">
  <!-- Checkout Form -->
  <div class="container mt-4">
    <h2>Checkout</h2>

    <div id="cartSummary" class="list-group mb-4">
      <!-- Cart items will be loaded here -->
    </div>

    <div class="row g-3">
      <div class="col-md-6">
        <input type="number" id="deliveryX" class="form-control" placeholder="Delivery X coordinate" required>
      </div>
      <div class="col-md-6">
        <input type="number" id="deliveryY" class="form-control" placeholder="Delivery Y coordinate" required>
      </div>
    </div>

    <div class="mt-3">
      <input type="text" id="upsAccountName" class="form-control" placeholder="UPS Account Name" required>
    </div>

    <div class="mt-4 d-grid">
      <button class="btn btn-primary btn-lg" onclick="checkout()">Place Order</button>
    </div>
  </div>
</div>
