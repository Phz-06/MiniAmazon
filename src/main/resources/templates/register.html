<div th:fragment="content" style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">
  <main class="form-signin text-center w-100 m-auto" style="max-width: 400px; padding: 15px;">
    <form id="registerForm">
      <i class="bi bi-amazon mb-4" style="font-size: 3rem;"></i>
      <h1 class="h3 mb-3 fw-normal">Create account</h1>

      <div class="form-floating mb-2">
        <input type="text" class="form-control" id="inputUsername" placeholder="Username" required>
        <label for="inputUsername">Username</label>
      </div>

      <div class="form-floating mb-2">
        <input type="email" class="form-control" id="inputEmail" placeholder="Email" required>
        <label for="inputEmail">Email</label>
      </div>

      <div class="form-floating mb-2">
        <input type="text" class="form-control" id="inputName" placeholder="Name (optional)" required>
        <label for="inputName">Name (optional)</label>
      </div>

      <div class="form-floating mb-2">
        <input type="password" class="form-control" id="inputPassword" placeholder="Password" required>
        <label for="inputPassword">Password</label>
      </div>

      <div class="form-floating mb-3">
        <input type="password" class="form-control" id="inputRepeatPassword" placeholder="Repeat your password" required>
        <label for="inputRepeatPassword">Repeat your password</label>
      </div>

      <div class="mt-3 mb-3">
        <span>Already a customer? <a href="/signin">Sign in here.</a></span>
      </div>

      <button class="w-100 btn btn-lg btn-primary" type="submit">Register</button>

      <p class="mt-5 mb-3 text-muted">&copy; 2025, Mini-Amazon</p>
    </form>
  </main>
</div>
