spring.application.name=order-service

# --- Database -----------------------------------------------------------
# No credential has a default: the app refuses to start without them.
# Local values live in .env (git-ignored); see .env.example.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/amazon}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Schema is owned by Flyway (src/main/resources/db/migration).
# Hibernate only checks that the entities still match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# Off: otherwise every HTTP request pins a pooled connection until the
# response is written, and the pool runs dry long before the database does.
spring.jpa.open-in-view=false

# --- Auth ---------------------------------------------------------------
# Base64, >= 512 bits (HS512). Generate with: openssl rand -base64 64
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration=86400000
# Bootstrap admin. Created at startup only when a password is supplied.
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:}
app.admin.email=${APP_ADMIN_EMAIL:admin@example.com}

server.port=8000

spring.thymeleaf.cache=false


# --- Kafka --------------------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Records are protobuf Envelopes (shared/src/main/proto/events.proto).
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer
# A record counts as sent only when every in-sync replica has it, and a
# retried send cannot create a duplicate or reorder a partition.
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.group-id=${spring.application.name}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
# Commit after each record is handled, so a crash replays at most one record
# (which the idempotent consumer then recognises).
spring.kafka.listener.ack-mode=record
