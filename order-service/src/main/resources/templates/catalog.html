<div th:fragment="content" class="container page">
  <div class="page-head">
    <div>
      <h1>Shop the catalog</h1>
      <p id="resultCount" aria-live="polite">Loading products…</p>
    </div>
  </div>

  <form id="filters" class="filters" role="search">
    <div class="field filters__search">
      <label class="visually-hidden" for="searchInput">Search products</label>
      <div class="input-group input-group--leading">
        <svg class="icon input-group__icon" aria-hidden="true"><use href="#i-search"/></svg>
        <input id="searchInput" class="input" type="search" placeholder="Search by name or description" autocomplete="off">
      </div>
    </div>
    <div class="field filters__sort">
      <label class="visually-hidden" for="sortSelect">Sort by</label>
      <select id="sortSelect" class="select">
        <option value="featured">Sort: Featured</option>
        <option value="price-asc">Price: low to high</option>
        <option value="price-desc">Price: high to low</option>
        <option value="name">Name: A to Z</option>
      </select>
    </div>
  </form>

  <div id="categoryChips" class="chips" role="group" aria-label="Filter by category"></div>

  <div id="productList" class="product-grid" aria-busy="true"></div>
</div>
