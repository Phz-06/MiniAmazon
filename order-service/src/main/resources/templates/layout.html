<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">MiniAmazon</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232563eb'/%3E%3Cpath d='M16 7l8 4.5v9L16 25l-8-4.5v-9z M8 11.5l8 4.5 8-4.5 M16 16v9' fill='none' stroke='%23fff' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">

  <!-- Type: Rubik for headings, Nunito Sans for text -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&family=Rubik:wght@500;600&display=swap">

  <!-- Design system, then the page's own sheet -->
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:if="${css}" th:href="@{'/css/' + ${css}}">
</head>

<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div th:replace="~{components/icons :: sprite}"></div>
  <div th:replace="~{components/navbar :: navbar}"></div>

  <main id="main">
    <div th:if="${template != null} and ${fragment != null}"
         th:replace="~{${template} :: ${fragment}}">
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>MiniAmazon</span>
      <span>Every order is packed, loaded and delivered exactly once.</span>
    </div>
  </footer>

  <!-- Announced politely; never takes focus -->
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <dialog id="confirmDialog" class="dialog" aria-labelledby="confirmTitle" aria-describedby="confirmBody">
    <h2 id="confirmTitle"></h2>
    <p id="confirmBody"></p>
    <div class="dialog__actions">
      <button type="button" class="btn btn--secondary" data-dialog-cancel>Cancel</button>
      <button type="button" class="btn btn--danger" data-dialog-confirm>Confirm</button>
    </div>
  </dialog>

  <script th:src="@{/js/utils.js}"></script>
  <script th:if="${js}" th:src="@{'/js/' + ${js}}"></script>
</body>

</html>
