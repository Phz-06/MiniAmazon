<div th:fragment="content" class="auth">
  <div class="card auth__card">
    <form id="signinForm" class="card__body" novalidate>
      <div>
        <h1>Sign in</h1>
        <p class="auth__lead">Pick up your cart and follow your orders.</p>
      </div>

      <div id="formAlert" tabindex="-1"></div>

      <div class="field">
        <label class="field__label" for="inputUsername">Username</label>
        <input type="text" class="input" id="inputUsername" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
      </div>

      <div class="field">
        <label class="field__label" for="inputPassword">Password</label>
        <div class="input-group">
          <input type="password" class="input" id="inputPassword" autocomplete="current-password" required>
          <button type="button" class="input-group__btn" data-toggle-password="inputPassword" aria-label="Show password" aria-pressed="false">
            <svg class="icon" aria-hidden="true"><use href="#i-eye"/></svg>
          </button>
        </div>
      </div>

      <button id="signinButton" class="btn btn--primary btn--lg btn--block" type="submit">Sign in</button>

      <p class="auth__switch">New here? <a href="/register">Create an account</a></p>
    </form>
  </div>
</div>
