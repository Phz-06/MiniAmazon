<div th:fragment="content" class="auth">
  <div class="card auth__card">
    <form id="registerForm" class="card__body" novalidate>
      <div>
        <h1>Create your account</h1>
        <p class="auth__lead">It takes a minute, and your cart is saved between visits.</p>
      </div>

      <div id="formAlert" tabindex="-1"></div>

      <div class="field">
        <label class="field__label" for="inputUsername">Username</label>
        <input type="text" class="input" id="inputUsername" autocomplete="username" autocapitalize="none" spellcheck="false"
               required minlength="3" maxlength="20" aria-describedby="usernameHint" data-hint="usernameHint" autofocus>
        <p id="usernameHint" class="field__hint">3 to 20 characters.</p>
      </div>

      <div class="field">
        <label class="field__label" for="inputEmail">Email</label>
        <input type="email" class="input" id="inputEmail" autocomplete="email" required>
      </div>

      <div class="field">
        <label class="field__label" for="inputName">Full name <span class="optional">(optional)</span></label>
        <input type="text" class="input" id="inputName" autocomplete="name">
      </div>

      <div class="field">
        <label class="field__label" for="inputPassword">Password</label>
        <div class="input-group">
          <input type="password" class="input" id="inputPassword" autocomplete="new-password"
                 required minlength="6" maxlength="40" aria-describedby="passwordHint" data-hint="passwordHint">
          <button type="button" class="input-group__btn" data-toggle-password="inputPassword" aria-label="Show password" aria-pressed="false">
            <svg class="icon" aria-hidden="true"><use href="#i-eye"/></svg>
          </button>
        </div>
        <p id="passwordHint" class="field__hint">6 to 40 characters.</p>
      </div>

      <div class="field">
        <label class="field__label" for="inputRepeatPassword">Repeat password</label>
        <div class="input-group">
          <input type="password" class="input" id="inputRepeatPassword" autocomplete="new-password" required>
          <button type="button" class="input-group__btn" data-toggle-password="inputRepeatPassword" aria-label="Show password" aria-pressed="false">
            <svg class="icon" aria-hidden="true"><use href="#i-eye"/></svg>
          </button>
        </div>
      </div>

      <button id="registerButton" class="btn btn--primary btn--lg btn--block" type="submit">Create account</button>

      <p class="auth__switch">Already have an account? <a href="/signin">Sign in</a></p>
    </form>
  </div>
</div>
