<div th:fragment="content" class="container page">

    <svg class="icon" aria-hidden="true"><use href="#i-arrow-left"/></svg>
    Back to catalog
  </a>

  <div id="productView" class="product" aria-busy="true">
    <div class="skeleton" style="aspect-ratio: 4 / 3"></div>
    <div class="product__info" aria-hidden="true">

      <div class="skeleton" style="height: 1.75rem; width: 30%"></div>
      <div class="skeleton" style="height: 4rem"></div>

    </div>
  </div>
</div>
