<header class="site-header" th:fragment="navbar">
  <div class="container site-header__inner">
    <a class="brand" href="/catalog">
      <span class="brand__mark"><svg class="icon" aria-hidden="true"><use href="#i-package"/></svg></span>
      MiniAmazon
    </a>

    <nav class="site-nav" aria-label="Main">
      <a class="site-nav__link" href="/catalog" data-nav="/catalog /product">Shop</a>
      <a class="site-nav__link" href="/cart" data-nav="/cart /checkout">
        Cart
        <span id="cartCount" class="count-badge" hidden></span>
      </a>
      <a class="site-nav__link" href="/orders" data-nav="/orders">Orders</a>
      <a id="adminLink" class="site-nav__link" href="/admin" data-nav="/admin" hidden>Warehouse</a>
    </nav>

    <div class="site-header__account">
      <span id="userGreeting" class="site-header__user" hidden>
        <svg class="icon" aria-hidden="true"><use href="#i-user"/></svg>
        <span>Signed in as</span> <strong id="userName"></strong>
      </span>
      <button id="signOutButton" type="button" class="btn btn--ghost btn--sm" hidden>Sign out</button>
      <a id="signInLink" class="btn btn--primary btn--sm" href="/signin">Sign in</a>
    </div>
  </div>
</header>
