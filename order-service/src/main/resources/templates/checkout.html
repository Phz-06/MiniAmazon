<div th:fragment="content">
  <div class="container mt-4">
    <h2>Checkout</h2>

    <form id="checkoutForm" class="row g-3">
      <div class="col-md-6">
        <label for="deliveryX" class="form-label">Delivery X</label>
        <input type="number" class="form-control" id="deliveryX" required>
      </div>
      <div class="col-md-6">
        <label for="deliveryY" class="form-label">Delivery Y</label>
        <input type="number" class="form-control" id="deliveryY" required>
      </div>
      <div class="col-md-12">
        <label for="upsAccountName" class="form-label">UPS Account Name</label>
        <input type="text" class="form-control" id="upsAccountName" required>
      </div>
      <div class="col-md-12">
        <label for="creditCardNumber" class="form-label">Credit Card Number</label>
        <input type="text" class="form-control" id="creditCardNumber" required>
      </div>
      <div class="col-12">
        <button type="button" class="btn btn-primary" onclick="checkout()">Place Order</button>
      </div>
    </form>

    <h4 class="mt-5">Cart Summary</h4>
    <div id="cartSummary" class="list-group"></div>

    <div class="mt-4">
      <strong>Total Amount: $<span id="cartTotal">0.00</span></strong>
    </div>
  </div>
</div>
