version: '3'
services:
  postgres:
    image: postgres:latest
    environment:
      - POSTGRES_DB=amazon
      - POSTGRES_PASSWORD=ERSSIG3
      - POSTGRES_USER=amazonuser
    volumes:
      - data-volume:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    depends_on:
      - postgres
    ports:
      - "8000:8000"
      - "8090:8090"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/amazon
      - SPRING_DATASOURCE_USERNAME=amazonuser
      - SPRING_DATASOURCE_PASSWORD=ERSSIG3
      - WORLD_HOST=host.docker.internal
      - WORLD_PORT=23456
      - SERVER_PORT=8000
      - AMAZON_SERVER_PORT=8090
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  data-volume: