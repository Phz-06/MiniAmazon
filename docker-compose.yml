# One command brings up everything the app needs:
#   cp .env.example .env   (fill it in once)
#   docker compose up --build
name: miniamazon

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-amazon}
      POSTGRES_USER: ${POSTGRES_USER:-amazon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Loopback only, for running the app from the IDE against this database.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8090}:8000"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-amazon}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-amazon}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?set APP_JWT_SECRET in .env}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-admin@example.com}
      WORLD_HOST: world
      WORLD_PORT: 23456

  # --- World simulator --------------------------------------------------
  # A closed-source x86-64 binary from the course. It is built straight from
  # its own repository rather than copied into this one, and runs emulated on
  # Apple Silicon. Its database host name and credentials are compiled in.
  world-db:
    image: postgres:12-alpine3.15
    environment:
      POSTGRES_DB: worldSim
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: abc123
    networks:
      default:
        aliases: [mydb]

  world:
    build:
      context: https://github.com/Phz-06/world_simulator_exec.git#master:docker_deploy
    platform: linux/amd64
    depends_on:
      - world-db
    # Arguments: UPS port, Amazon port, flakiness (0-99: chance a message is dropped).
    command: bash -c "./wait-for-it.sh mydb:5432 --strict -- ./server 12345 23456 ${WORLD_FLAKINESS:-0}"
    ports:
      - "127.0.0.1:12345:12345"
      - "127.0.0.1:23456:23456"

volumes:
  pgdata:
