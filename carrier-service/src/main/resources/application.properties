spring.application.name=carrier-service
# No HTTP API: this service speaks Kafka on one side and the world's TCP protocol on the other.
spring.main.web-application-type=none

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/carrier}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

world.host=${WORLD_HOST:localhost}
world.port=${WORLD_UPS_PORT:12345}

# World relay, reconnect and Kafka relay must not queue behind one another.
spring.task.scheduling.pool.size=4

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.group-id=${spring.application.name}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
spring.kafka.listener.ack-mode=record

# Size of the fleet registered with the world.
app.carrier.trucks=${CARRIER_TRUCKS:10}
